name: keepalive

# Warms every Cloud Run service behind a public demo, and fails loudly if one
# is unreachable.
#
# Why not Cloud Scheduler: its free tier is 3 jobs per billing account and one
# is already used by model-serving. Nine services need warming. GitHub Actions
# cron is free and unlimited on public repositories.
#
# Why this is free on Cloud Run too: Cloud Run bills request-processing time
# unless CPU-always-allocated is set, so an instance that is alive but idle
# costs nothing. The ping buys warmth for the price of a few-ms request. Do NOT
# "fix" cold starts with --min-instances 1 instead: that switches on
# instance-lifetime billing, roughly $35-40/month per service.

on:
  # Dormant as of 8 October 2026. The schedule was:
  #
  #   schedule:
  #     - cron: "*/10 * * * *"
  #
  # Every 10 minutes, because Cloud Run keeps an idle instance for ~15 minutes,
  # so that stayed comfortably inside the window.
  #
  # There is nothing left to warm. The Google Cloud billing account behind all
  # six remaining services is closed and every one returns 503 — see
  # services.txt, where the list is kept commented rather than deleted, and
  # SERVICES_LEDGER.md for the symptom and what it cost.
  #
  # This is NOT being switched off because it was failing. It was failing
  # correctly: six demos are down and it said so, every ten minutes, which is
  # exactly what the README means by "a keepalive nobody checks is
  # indistinguishable from no keepalive at all". It is switched off because the
  # alarm has been heard and there is no longer a service for the ping to buy
  # anything from. Running it now would mean emailing a daily report of a fact
  # that cannot change until someone reopens a billing account.
  #
  # Note the consequence, since this repository documents it elsewhere: GitHub
  # disables scheduled workflows in a repository with no activity for 60 days,
  # and with no cron there are no STATUS.md commits to prevent that. That does
  # not matter while the cron is commented out, but it does mean restoring this
  # is two steps, not one — uncomment the schedule AND check that Actions has
  # not disabled scheduled runs on the repository in the meantime.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Warm all services
        id: ping
        continue-on-error: true          # so the status file is still recorded
        shell: bash
        run: |
          # pipefail, or the exit status comes from tee and a total failure of
          # ping.sh reports as a green run. That happened on the first version
          # of this workflow: the script was not executable, nothing ran, and
          # the job passed.
          set -o pipefail
          # `bash ping.sh`, not `./ping.sh` — the executable bit does not
          # survive a commit from Windows, so relying on it fails on the runner.
          bash ping.sh | tee result.txt

      - name: Record status
        # STATUS.md carries only the date, so it changes at most once a day and
        # this commits at most once a day. That is deliberate: GitHub disables
        # scheduled workflows in a repository with no activity for 60 days, so
        # a keepalive with no commits eventually switches itself off — exactly
        # the silent failure it exists to prevent.
        if: always()
        run: |
          {
            echo "# Status"
            echo
            echo "Last successful check: $(date -u +%Y-%m-%d)"
            echo
            echo '```'
            cat result.txt 2>/dev/null || echo "no result recorded"
            echo '```'
          } > STATUS.md
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add STATUS.md
          # --cached, and after `git add`: `git diff` on an untracked file
          # reports no change, so the very first run committed nothing and the
          # anti-disable mechanism never armed.
          if ! git diff --cached --quiet STATUS.md; then
            git commit -m "status: $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Fail if any service was unreachable
        if: steps.ping.outcome == 'failure'
        run: |
          echo "::error::One or more services did not return 200 — see the table above."
          exit 1

      - name: Confirm the check actually ran
        # A guard against the failure this workflow already had once: reporting
        # success without having pinged anything.
        run: |
          test -s result.txt || { echo "::error::result.txt is empty — ping.sh did not run."; exit 1; }
          grep -q "SERVICE" result.txt || { echo "::error::result.txt has no table."; exit 1; }
          echo "Checked $(( $(wc -l < result.txt) - 1 )) services."
